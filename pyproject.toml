[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "uniswap-smart-path"
version = "0.4.0"
authors = [
  { name="Elnaril", email="elnaril_dev@caramail.com" },
]
description = "Find the path from v2 and v3 pools to swap with the best price"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
license = "MIT"
dependencies = [
    "web3>=7.15.0,<9.0.0",
    "uniswap-universal-router-decoder>=v0.8.0",
    "credit-rate-limit>=0.2.0,<1.0.0"
]
keywords = ["blockchain", "ethereum", "uniswap", "exchange", "dex", "universal router", "swap", "path", "route", "pools"]

[tool.setuptools]
packages = ["uniswap_smart_path"]

[project.urls]
"Homepage" = "https://github.com/Elnaril/uniswap-smart-path"
"Bug Tracker" = "https://github.com/Elnaril/uniswap-smart-path/issues"
"Fiverr" = "https://www.fiverr.com/freelancers/elnaril"
"Buy Me A Coffee" = "https://www.buymeacoffee.com/elnaril"
"Malt" = "https://www.malt.com/profile/elnaril"
