name: Continous Integration

on:
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE'
      - 'integration_tests/**'
      - 'tutorials/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'coverage.json'
      - 'media'
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE'
      - 'integration_tests/**'
      - 'tutorials/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'coverage.json'
      - 'media'

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["all"]

    environment:
      name: CI

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
    - name: Set up supported Python versions
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: |
          3.10
          3.12
          3.14
    - name: Install tox and any other packages
      run: |
        pip install -U pip
        pip install tox
    - name: Run tox
      run: |
        export RPC_ENDPOINT=${{ secrets.RPC_ENDPOINT }}
        python --version
        pip freeze
        tox
