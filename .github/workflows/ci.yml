name: Continous Integration

on:
  push:
    paths-ignore:
      - 'AGENTS.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'integration_tests/**'
      - 'tutorials/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'coverage.json'
      - 'media/**'
      - 'scripts/**'
  pull_request:
    paths-ignore:
      - 'AGENTS.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'integration_tests/**'
      - 'tutorials/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'coverage.json'
      - 'media/**'
      - 'scripts/**'

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["all"]

    environment:
      name: CI

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up supported Python versions
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: |
          3.10
          3.12
          3.14
    - name: Install tox and any other packages
      run: |
        pip install -U pip
        pip install tox
    - name: Run tox
      run: |
        export RPC_ENDPOINT=${{ secrets.RPC_ENDPOINT }}
        python --version
        pip freeze
        tox
